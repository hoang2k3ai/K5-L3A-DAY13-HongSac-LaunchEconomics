# Lab 13 · TV2 · Kế hoạch pilot LogiX-VN · Gate 2a
# Đề xuất để nhóm duyệt; chưa phải bằng chứng pilot đã diễn ra hoặc đã được ký.
# Nguồn số: python lab13.py --kiem-so và python lab13.py --pilot-only (trong src/).
#
# D1 · baseline 0,70; +5 điểm phần trăm; alpha 0,05 hai phía; power 0,8; ICC 0,02
# a) Theo yêu cầu: 1.251 yêu cầu/nhánh, tổng 2.502.
# b) Theo nhân viên m=75: DE=1+74*0,02=2,48; ceil(1.251*2,48)=3.103/nhánh;
#    ceil(3.103/75)=42 nhân viên/nhánh, tổng 84 > 40 nên không đủ người.
# c) 20 nhân viên/nhánh: n_eff < 20/0,02=1.000, không đạt 1.251 dù kéo dài.
# d) 6 depot/nhánh: n_eff < 6/0,02=300; chỉ 6 cụm/nhánh, dưới yêu cầu 20.
# e) Chấp nhận +6 điểm, cần 859 hiệu dụng/nhánh:
#    20m/(0,98+0,02m)>=859 => m>=298,518 => chọn 299 yêu cầu/người.
#    DE=6,96; thu 20*299=5.980/nhánh; n_eff=859,1954.
#
# D2 · Năm câu kiểm tra tách được tác động (thiết kế đề xuất)
# 1. Đối chứng: 20 nhân viên tự xử lý cùng thời gian, cùng loại yêu cầu.
# 2. Ngẫu nhiên: phân tầng depot, seed 13; chia 20 can thiệp và 20 đối chứng;
#    roster và thứ tự kích hoạt 4 -> 10 -> 20 được khóa trước khi thấy kết quả.
# 3. Tràn tác động: vẫn có do trao đổi trong depot; khóa quyền theo staff_id,
#    không đổi người giữa nhánh, log truy cập và hướng dẫn không chia sẻ gợi ý.
# 4. Viết trước: chỉ số, MDE, ngưỡng, cửa sổ dữ liệu, ngày quyết định; phân tích
#    một lần, không dừng sớm vì p-value; cần COO phê duyệt trước 23/11/2026.
# 5. Số cụm: đúng 20 nhân viên/nhánh; cần roster 40 người, không lấy 20 người
#    trong CSV mẫu làm đủ 40 người; thiếu roster hoặc mất cụm thì chưa bật pilot.
#
# Đánh đổi: đủ mẫu xấp xỉ cho +6 điểm, không đủ power 0,8 cho +5 điểm.
# Power xấp xỉ ở +5 điểm chỉ 0,6418 (NormalIndPower, n_eff=859,1954).
# MDE là tham số thiết kế; mục tiêu kinh doanh vẫn tăng ít nhất 5 điểm.
# Phân tích thực tế phải xét cụm staff_id và phân tầng depot; đây là tính toán
# DE theo lab, không phải chứng minh power chính xác cho mọi phân bố cụm.
#
# Mở lại hiện tại: 51/1.200=4,25%; phạm vi 39/982=3,9715%.
# Ngưỡng đề xuất: cao hơn đối chứng >=2 điểm hoặc trần tuyệt đối >6%.
# 3% thấp hơn cả baseline nên không chọn; 6% chưa bị vượt ở dữ liệu chạy thử.
# So với đối chứng phải dùng dữ liệu pilot cùng lúc, không thay bằng 4,25%.
# Các ngưỡng 6%, 2 điểm, 8.000 đ và 40% là quy tắc đề xuất, không phải kết quả đo.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  approval_status: "Đề xuất chờ nhóm và Giám đốc vận hành duyệt trước khi bắt đầu"
