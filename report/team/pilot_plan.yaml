    sample_gate: "Ít nhất 299 yêu cầu trưởng thành/người ở đủ 20 người/nhánh; nếu không đạt hoặc cỡ cụm lệch mạnh thì báo chưa đủ bằng chứng, không tự hạ MDE/đổi mẫu sau xem kết quả"
