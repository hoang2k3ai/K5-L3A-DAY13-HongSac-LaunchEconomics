    retry_policy: "Tối đa 2 lần chạy rồi chuyển nhân viên; lựa chọn từ B3 toàn mẫu (simulated), cần kiểm tra lại bằng phút đo thật trong phạm vi pilot"
    stable_phase: "Chỉ đánh giá tác động khi đủ 20 can thiệp +20 đối chứng, cấu hình và chính sách xem lại đã khóa; đổi cấu hình giữa cửa sổ thì không kết luận gộp"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    definition: "Số yêu cầu đóng trong 24h và không mở lại trong 7 ngày chia mọi yêu cầu đủ điều kiện theo nhánh; dùng cohort đủ thời gian quan sát"
